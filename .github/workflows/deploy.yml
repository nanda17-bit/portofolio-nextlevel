name: Deploy Portofolio to Arch Linux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Ganti /var/www/portofolio sesuai letak kodingan portofolio kamu di server
            cd /var/www/portofolio
            git pull origin main
            npm install
            npm run build
            pm2 restart portofolio
